name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Source-only editor startup guard (before dependency install)
        run: python -m unittest tests/test_editor_startup_guard.py -v
      - run: python -m pip install -e .
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
      - run: git diff --check
      - name: executable example smoke
        run: driftguard evaluate --state examples/save_state.json --evidence examples/evidence.json --observation examples/observation.txt --db driftguard-ci.db --session ci-example --turn 0 --expected-generation 0
