name: action-smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Ordinary local action smoke
        uses: ./
        id: driftguard
        with:
          policy: examples/ci/driftguard.toml
          baseline: examples/ci/baseline.json
          candidate: examples/ci/candidate-pass.json
          trusted-ref: workspace

      - name: Assert ordinary action output
        shell: bash
        run: |
          test "${{ steps.driftguard.outputs.decision }}" = "PASS"
          test -n "${{ steps.driftguard.outputs.result-digest }}"

      - name: Tamper workspace baseline
        shell: bash
        run: cp examples/ci/candidate-block.json examples/ci/baseline.json

      - name: Auto trust rejects self-laundered candidate
        uses: ./
        id: hostile
        continue-on-error: true
        with:
          policy: examples/ci/driftguard.toml
          baseline: examples/ci/baseline.json
          candidate: examples/ci/candidate-block.json
          trusted-ref: auto

      - name: Assert hostile auto gate remained closed
        shell: bash
        run: |
          test "${{ steps.hostile.outcome }}" = "failure"
          test "${{ steps.hostile.outputs.decision }}" = "BLOCK"
          test -n "${{ steps.hostile.outputs.trusted-ref }}"
          test "${{ steps.hostile.outputs.trusted-ref }}" != "workspace"
