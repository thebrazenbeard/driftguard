[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftguard"
version = "0.2.0"
description = "Deterministic regression admission and behavioral drift governance for AI systems"
requires-python = ">=3.11"
readme = "README.md"\nlicense = "Apache-2.0"
keywords = ["ai", "agents", "evals", "ci", "regression-testing", "llm"]
dependencies = []

[project.urls]
Homepage = "https://github.com/thebrazenbeard/driftguard"
Repository = "https://github.com/thebrazenbeard/driftguard"
Issues = "https://github.com/thebrazenbeard/driftguard/issues"

[project.scripts]
driftguard = "driftguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
